name: Fetch stuff and commit changes

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "30 */6 * * *"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/cache@v4
        id: node-modules
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils

      - name: Install qsv
        run: |
          QSV_VERSION=22.0.1
          curl -L "https://github.com/dathere/qsv/releases/download/${QSV_VERSION}/qsv-${QSV_VERSION}-x86_64-unknown-linux-musl.zip" -o qsv.zip
          unzip qsv.zip qsvlite
          sudo mv qsvlite /usr/local/bin/qsv
          rm qsv.zip

      - name: Fetch
        run: |
          curl -A "bustimes.org (https://github.com/bustimes/scrapings)" -s "https://cdn.adfirst.media/hb/bustimes.js" | npx js-beautify > bustimes.js
          curl -s "https://www.travelinedata.org.uk/noc/api/1.0/nocrecords.xml" | iconv -f utf-8 -t utf-8 -c | xmllint --format - > nocrecords.xml
          curl -s "https://naptan.api.dft.gov.uk/v1/access-nodes?dataFormat=csv" > stops.csv
          qsv partition AdministrativeAreaCode naptan stops.csv
          rm stops.csv
          cd naptan

          bash rename.sh
          rrl=$(curl -s "https://rrl.api.dft.gov.uk/v1/rail-replacement/stops/download?format=csv" | jq -r '.downloadUrl')
          curl -s "$rrl" -o "154 911 National - Rail Replacement.csv"

      - name: Commit and push
        run: |-
          git config user.name "Automated"
          git config user.email "actions@users.noreply.github.com"
          git diff

          echo "js"
          git add bustimes.js
          git commit -m "update bustimes.js" || true

          echo "naptan"
          git add naptan
          git commit -m "update naptan" || true

          echo "noc"
          if [ "$(git diff --shortstat nocrecords.xml)" != " 1 file changed, 1 insertion(+), 1 deletion(-)" ]; then
            git add nocrecords.xml
            git commit -m "update nocrecords.xml (NOC)" || true
          fi
          git status
          git push
